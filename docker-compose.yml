version: "2.1"

volumes:
  state: {}

services:
  tailscale:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    restart: on-failure
    privileged: true
    devices:
      - /dev/net/tun
    volumes:
      - state:/var/lib/tailscale   # or `state:/var/lib/tailscale` on the home compose
    labels:
      - io.balena.features.kernel-modules=1
      - io.balena.features.procfs=1
    cap_add:
      - net_admin
      - net_raw
      - sys_module
    tmpfs:
      - /tmp
      - /var/run/